services:
  mysql:
    image: mysql:8.4
    container_name: smartfix-maintenance-mysql
    environment:
      MYSQL_DATABASE: smartfix_maintenance
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-smartfix_local}
    ports:
      - "3307:3306"
    volumes:
      - smartfix_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-smartfix_local}"]
      interval: 10s
      timeout: 5s
      retries: 10

  maintenance-service:
    build: .
    container_name: smartfix-maintenance-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartfix_maintenance?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-smartfix_local}
      PORT: 8084
    ports:
      - "8084:8084"

volumes:
  smartfix_mysql_data:
